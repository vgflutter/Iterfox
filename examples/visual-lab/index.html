<!doctype html><html lang="en"><meta charset="utf-8"><title>Avatar</title>
<style>body{margin:0;background:#f5f2eb;display:grid;place-items:center;height:600px}#avatar{width:180px;height:180px;border-radius:0%;background:#7f9368;display:grid;place-items:center;box-shadow:0 12px 0 #ddd9ce}.face{width:90px;height:68px;background:#f6d2aa;border-radius:45%;position:relative}.face:before,.face:after{content:"";position:absolute;top:24px;width:8px;height:10px;background:#253022;border-radius:50%}.face:before{left:24px}.face:after{right:24px}</style>
<main id="avatar" aria-label="Round avatar"><div class="face"></div></main></html>
